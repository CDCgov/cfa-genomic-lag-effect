name: Run pytest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: pipx install uv

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          cache: uv
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test
        run: uv run pytest -v
